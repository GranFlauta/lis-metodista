# Servidor local (On-Premise): PostgreSQL + FastAPI + Frontend estático tras Caddy (HTTPS).
# Arranque:  cp .env.example .env  (editar)  &&  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Solo se ejecutan al crear el volumen por primera vez (BD vacía).
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # La BD NO se publica al exterior: solo la ve el backend por la red interna.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  web: # Caddy: HTTPS + frontend estático + proxy /api -> backend
    build: ./frontend
    restart: unless-stopped
    environment:
      LIS_HOST: ${LIS_HOST}
    ports:
      - "8443:443"

    volumes:
      - caddy_data:/data # conserva la CA interna y los certificados
    depends_on:
      - backend

  backup: # pg_dump diario con rotación
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint:
      ["/bin/sh", "-c", "while true; do /bin/sh /backup.sh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
